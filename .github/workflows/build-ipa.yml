# Builds the 3D Model Anything iPhone app as an UNSIGNED .ipa on a GitHub-hosted Mac.
# Sign and install it from Windows with Sideloadly (see docs/iphone-sideload.md).
#
# Manual trigger only: Actions tab -> "Build iPhone app (unsigned IPA)" -> Run workflow.
name: Build iPhone app (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID. Keep it identical forever, or the phone treats it as a new, empty app.
        required: true
        default: com.gabrielestefanelli.housecapture

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 image (Apple Silicon). The app needs at least the iOS 26 SDK (Liquid Glass API).
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/house-capture
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project HouseCapture.xcodeproj

      # Release on purpose: the app's README says Debug builds make scanning slow.
      # Signing is disabled here; Sideloadly signs the app with your Apple ID on Windows.
      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/HouseCapture.app

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/HouseCapture.app
          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle ID in app: $ACTUAL_ID"
          test "$ACTUAL_ID" = "$BUNDLE_ID"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "HouseCapture-unsigned.ipa" Payload
          ls -lh HouseCapture-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa-run${{ github.run_number }}
          path: apps/house-capture/HouseCapture-unsigned.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-run${{ github.run_number }}
          path: apps/house-capture/xcodebuild.log
          if-no-files-found: ignore
